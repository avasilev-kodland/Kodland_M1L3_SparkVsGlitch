<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Helper</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a10;touch-action:none;}
  #wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}
  canvas{display:block;width:100%;flex:1 1 auto;min-height:0;cursor:pointer;}
  .overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 40%,rgba(255,176,64,.16),rgba(8,6,12,.62) 62%);cursor:pointer;transition:opacity .22s;}
  .hidden{opacity:0;pointer-events:none;visibility:hidden;}
  .btn{width:clamp(78px,18vw,104px);height:clamp(78px,18vw,104px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe27a,#ffb347 42%,#e08922);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(255,179,71,.22),0 16px 40px rgba(255,140,40,.45);animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .tri{width:0;height:0;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:28px solid #3a2208;margin-left:6px;}
  .big{font-size:clamp(64px,20vw,128px);font-weight:900;color:#fff;line-height:1;text-shadow:0 0 28px rgba(255,180,70,.55),4px 4px 0 #3a1808;}
  .best{display:flex;align-items:center;gap:10px;font-size:clamp(22px,6vw,32px);font-weight:800;color:#ffd56a;text-shadow:2px 2px 0 #3a1808;}
  #mute{position:absolute;top:10px;right:12px;z-index:9;width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(20,16,24,.72);color:#ffe27a;font-size:22px;cursor:pointer;line-height:1;box-shadow:0 0 0 1px rgba(255,200,120,.2);}
  #score{position:absolute;top:12px;left:0;right:0;text-align:center;z-index:7;display:none;
    font:900 clamp(32px,8vw,56px)/1 Arial,sans-serif;color:#fff;text-shadow:0 0 18px rgba(255,170,70,.5),3px 3px 0 #2a1208;pointer-events:none;}
  #dock{flex:0 0 auto;z-index:6;padding:8px 10px 12px;background:linear-gradient(180deg,rgba(12,10,16,0),rgba(12,10,16,.94) 18%);
    display:none;}
  #dock.show{display:block;}
  #queue{height:42px;display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:8px;min-height:42px;}
  #queue span{width:34px;height:34px;border-radius:10px;background:#2a241c;color:#ffe27a;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,200,120,.25);}
  #queue span.on{background:#5a4018;box-shadow:0 0 0 2px #ffe27a;}
  #keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  #keys button{width:clamp(52px,13vw,70px);height:clamp(52px,13vw,70px);border:0;border-radius:16px;cursor:pointer;
    background:#2a241c;color:#ffe27a;font-size:clamp(22px,6vw,30px);box-shadow:0 0 0 1px rgba(255,200,120,.22);}
  #keys button#run{background:#c9f24d;color:#17301f;}
  #keys button:active{transform:scale(.94);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="score">0</div>
  <button id="mute" type="button" aria-label="mute">🔊</button>
  <div id="dock">
    <div id="queue"></div>
    <div id="keys">
      <button type="button" data-cmd="F">↑</button>
      <button type="button" data-cmd="L">↶</button>
      <button type="button" data-cmd="R">↷</button>
      <button type="button" data-cmd="D">⛏</button>
      <button type="button" id="undo">⌫</button>
      <button type="button" id="run">▶</button>
    </div>
  </div>
  <div id="intro" class="overlay">
    <div class="btn"><div class="tri"></div></div>
  </div>
  <div id="over" class="overlay hidden">
    <div class="big" id="finalScore">0</div>
    <div class="best"><span>🏆</span><span id="bestScore">0</span></div>
    <div class="btn"><div class="redo" style="font-size:48px;color:#3a2208">↻</div></div>
  </div>
</div>
<script>
(function(){
  var LEVELS=[
    {face:0, rows:['#######','#T...*#','#######']},
    {face:0, rows:['#####','#T..#','#..*#','#####']},
    {face:0, rows:['#######','#T..G*#','#######']},
    {face:0, rows:['#####','#T#.#','#...#','#..*#','#####']},
    {face:0, rows:['#####','#.*.#','#...#','#.T.#','#####']},
    {face:0, rows:['######','#T.G.#','#...G#','#....*','######']}
  ];

  var DX=[1,0,-1,0], DY=[0,1,0,-1];
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var intro=document.getElementById('intro'), over=document.getElementById('over');
  var dock=document.getElementById('dock'), queueEl=document.getElementById('queue');
  var scoreEl=document.getElementById('score'), muteBtn=document.getElementById('mute');
  var finalScoreEl=document.getElementById('finalScore'), bestScoreEl=document.getElementById('bestScore');
  var W=0,H=0,DPR=1, t=0, last=performance.now();
  var KEY='cf89-m01l03-helper-best';
  var state='intro', muted=false, score=0, best=0, lvl=0, running=false, stepI=-1;
  var grid=[], cols=0, rows=0, start={}, turtle={}, gem={}, prog=[], shake=0, flash=0, parts=[];
  var cell=40, ox=0, oy=0;
  try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  bestScoreEl.textContent=best;

  var ac=null;
  function tone(f,d,ty,v){
    if(muted) return;
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=ty||'sine'; o.frequency.value=f; g.gain.value=v||0.045;
      o.connect(g); g.connect(ac.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
      o.stop(ac.currentTime+d+0.02);
    }catch(e){}
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,cv.clientWidth||1); H=Math.max(1,cv.clientHeight||1);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  function layout(){
    if(!cols) return;
    var pad=16;
    cell=Math.floor(Math.min((W-pad*2)/cols,(H-pad*2)/rows));
    ox=Math.floor((W-cell*cols)/2); oy=Math.floor((H-cell*rows)/2);
  }
  function parseLevel(lv){
    var rowsA=lv.rows, g=[], sx=1,sy=1,gx=1,gy=1;
    rows=rowsA.length; cols=rowsA[0].length;
    for(var y=0;y<rows;y++){
      g[y]=[];
      for(var x=0;x<cols;x++){
        var ch=rowsA[y][x]||'#';
        if(ch==='T'){sx=x;sy=y;ch='.';}
        if(ch==='*'){gx=x;gy=y;ch='.';}
        g[y][x]=ch;
      }
    }
    return {g:g, sx:sx, sy:sy, gx:gx, gy:gy, face:lv.face};
  }
  function loadLevel(){
    var p=parseLevel(LEVELS[lvl%LEVELS.length]);
    grid=p.g.map(function(r){return r.slice();});
    start={x:p.sx,y:p.sy,face:p.face};
    gem={x:p.gx,y:p.gy};
    turtle={x:p.sx,y:p.sy,face:p.face};
    running=false; stepI=-1;
    layout(); drawQueue();
  }
  function resetTurtle(){
    turtle={x:start.x,y:start.y,face:start.face};
    var p=parseLevel(LEVELS[lvl%LEVELS.length]);
    grid=p.g.map(function(r){return r.slice();});
    running=false; stepI=-1; drawQueue();
  }
  function at(x,y){
    if(y<0||x<0||y>=rows||x>=cols) return '#';
    return grid[y][x];
  }
  function burst(x,y,col,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*6.28, s=1+Math.random()*3;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,r:2+Math.random()*2,col:col});
    }
  }
  function drawQueue(){
    queueEl.innerHTML='';
    for(var i=0;i<prog.length;i++){
      var s=document.createElement('span');
      s.textContent={F:'↑',L:'↶',R:'↷',D:'⛏'}[prog[i]];
      if(i===stepI) s.className='on';
      queueEl.appendChild(s);
    }
  }
  function addCmd(c){
    if(state!=='play'||running) return;
    if(prog.length>=10) return;
    prog.push(c); drawQueue(); tone(520,0.05,'triangle',0.03);
  }
  function undo(){
    if(state!=='play'||running) return;
    prog.pop(); drawQueue(); tone(240,0.05,'square',0.03);
  }
  function bonk(){
    shake=8; flash=0.4; tone(110,0.16,'sawtooth',0.05);
    resetTurtle();
  }
  function winLevel(){
    running=false;
    score+=1; scoreEl.textContent=score;
    if(score>best){ best=score; try{localStorage.setItem(KEY,String(best));}catch(e){} }
    burst(ox+(gem.x+0.5)*cell, oy+(gem.y+0.5)*cell, '#7efce8', 28);
    tone(523,0.1,'triangle',0.05); setTimeout(function(){tone(659,0.1,'triangle',0.05);},80); setTimeout(function(){tone(784,0.16,'triangle',0.05);},160);
    setTimeout(function(){
      lvl+=1; prog=[]; loadLevel();
    }, 700);
  }
  function step(){
    if(!running) return;
    if(stepI>=prog.length){
      running=false; stepI=-1; drawQueue();
      if(turtle.x===gem.x && turtle.y===gem.y) winLevel();
      else bonk();
      return;
    }
    var cmd=prog[stepI];
    var nx=turtle.x+DX[turtle.face], ny=turtle.y+DY[turtle.face];
    var next=at(nx,ny);
    if(cmd==='L') turtle.face=(turtle.face+3)%4;
    else if(cmd==='R') turtle.face=(turtle.face+1)%4;
    else if(cmd==='D'){
      if(next==='G'){ grid[ny][nx]='.'; burst(ox+(nx+0.5)*cell, oy+(ny+0.5)*cell, '#c9a227', 10); tone(340,0.07,'square',0.04); }
    }else if(cmd==='F'){
      if(next==='#' || next==='X' || next==='G'){ bonk(); return; }
      turtle.x=nx; turtle.y=ny;
      tone(480,0.04,'sine',0.03);
      if(turtle.x===gem.x && turtle.y===gem.y){ drawQueue(); winLevel(); return; }
    }
    stepI++;
    drawQueue();
    setTimeout(step, 280);
  }
  function run(){
    if(state!=='play'||running) return;
    if(!prog.length){ tone(160,0.08,'square',0.03); return; }
    resetTurtle();
    running=true; stepI=0; drawQueue();
    setTimeout(step, 220);
  }

  function start(){
    if(ac && ac.state==='suspended') ac.resume();
    score=0; lvl=0; prog=[]; parts=[];
    state='play';
    intro.classList.add('hidden'); over.classList.add('hidden');
    dock.classList.add('show'); scoreEl.style.display='block'; scoreEl.textContent='0';
    loadLevel(); tone(392,0.08,'triangle',0.04);
  }

  function drawTile(x,y,kind){
    var px=ox+x*cell, py=oy+y*cell, s=cell-3;
    var pal={
      '#':['#3a3734','#2a2724','#1c1a18'],
      '.':['#8a847c','#6e6a66','#4a4642'],
      'G':['#c9a227','#8b6230','#5a3a18'],
      'X':['#c46bff','#5a1a7a','#2a0a40']
    }[kind]||['#6e6a66','#4a4642','#2a2724'];
    ctx.fillStyle=pal[2]; ctx.fillRect(px,py,cell-1,cell-1);
    ctx.fillStyle=pal[1]; ctx.fillRect(px+1,py+1,s,s);
    ctx.fillStyle=pal[0]; ctx.fillRect(px+1,py+1,s,Math.max(3,s*0.16));
    if(kind==='G'){
      ctx.fillStyle='#ffe566'; ctx.fillRect(px+s*0.3, py+s*0.35, s*0.18, s*0.18);
    }
    if(kind==='X'){
      ctx.strokeStyle='#f0c8ff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px+s*0.2,py+s*0.25); ctx.lineTo(px+s*0.7,py+s*0.7); ctx.stroke();
    }
  }
  function drawGem(){
    var px=ox+(gem.x+0.5)*cell, py=oy+(gem.y+0.5)*cell+Math.sin(t*0.12)*3;
    var r=cell*0.22;
    ctx.save(); ctx.translate(px,py);
    ctx.shadowColor='#7efce8'; ctx.shadowBlur=14;
    ctx.fillStyle='#3ed4d8';
    ctx.beginPath(); ctx.moveTo(0,-r*1.3); ctx.lineTo(r,0); ctx.lineTo(0,r*1.2); ctx.lineTo(-r,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d9fffb'; ctx.beginPath(); ctx.moveTo(0,-r*1.3); ctx.lineTo(r*0.35,0); ctx.lineTo(0,r*0.2); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
  }
  function drawTurtle(){
    var px=ox+(turtle.x+0.5)*cell, py=oy+(turtle.y+0.5)*cell;
    ctx.save(); ctx.translate(px,py); ctx.rotate(turtle.face*Math.PI/2);
    var s=cell*0.32;
    ctx.fillStyle='#3d6b28'; ctx.fillRect(-s*0.95,-s*0.7,s*1.9,s*1.4);
    ctx.fillStyle='#62b04a'; ctx.fillRect(-s*0.8,-s*0.85,s*1.6,s*1.1);
    ctx.fillStyle='#1a2218'; ctx.fillRect(-s*0.45,-s*0.45,s*0.9,s*0.5);
    ctx.fillStyle='#7efce8'; ctx.fillRect(-s*0.28,-s*0.32,s*0.56,s*0.24);
    ctx.fillStyle='#c9a227';
    ctx.beginPath(); ctx.moveTo(s*0.7,-s*0.15); ctx.lineTo(s*1.35,-s*0.55); ctx.lineTo(s*1.15,s*0.15); ctx.closePath(); ctx.fill();
    ctx.shadowColor='#ffd27a'; ctx.shadowBlur=12;
    ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(0,-s*1.15,s*0.28,0,7); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
  }
  function drawCave(){
    ctx.fillStyle='#100e14'; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W/2,H*0.35,20,W/2,H*0.35,Math.max(W,H)*0.6);
    g.addColorStop(0,'rgba(255,160,60,0.07)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(!cols) return;
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++) drawTile(x,y,grid[y][x]);
    if(!(turtle.x===gem.x && turtle.y===gem.y)) drawGem();
    drawTurtle();
  }

  function frame(now){
    var dt=Math.min(2,(now-last)/16.67); last=now; t+=dt;
    if(shake>0){shake*=0.86; if(shake<0.2) shake=0;}
    if(flash>0){flash-=0.05*dt; if(flash<0) flash=0;}
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.vy+=0.08*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=0.03*dt;
      if(p.life<=0) parts.splice(i,1);
    }
    ctx.save();
    if(shake) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    drawCave();
    ctx.globalCompositeOperation='lighter';
    for(var q=0;q<parts.length;q++){
      var p=parts[q]; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore();
    if(flash>0){ctx.fillStyle='rgba(255,90,110,'+(flash*0.2)+')'; ctx.fillRect(0,0,W,H);}
    requestAnimationFrame(frame);
  }

  document.querySelectorAll('#keys [data-cmd]').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); addCmd(b.getAttribute('data-cmd')); });
  });
  document.getElementById('undo').addEventListener('click', function(e){ e.stopPropagation(); undo(); });
  document.getElementById('run').addEventListener('click', function(e){ e.stopPropagation(); run(); });
  muteBtn.addEventListener('click', function(e){
    e.stopPropagation(); muted=!muted; muteBtn.textContent=muted?'🔇':'🔊';
    if(!muted && ac && ac.state==='suspended') ac.resume();
  });
  intro.addEventListener('mousedown', function(){ if(state!=='play') start(); });
  intro.addEventListener('touchstart', function(e){ e.preventDefault(); if(state!=='play') start(); },{passive:false});
  over.addEventListener('mousedown', function(){ if(state!=='play') start(); });
  over.addEventListener('touchstart', function(e){ e.preventDefault(); if(state!=='play') start(); },{passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code==='ArrowUp'){ e.preventDefault(); addCmd('F'); }
    if(e.code==='ArrowLeft'){ e.preventDefault(); addCmd('L'); }
    if(e.code==='ArrowRight'){ e.preventDefault(); addCmd('R'); }
    if(e.code==='KeyX'){ e.preventDefault(); addCmd('D'); }
    if(e.code==='Backspace'){ e.preventDefault(); undo(); }
    if(e.code==='Enter'||e.code==='Space'){
      e.preventDefault();
      if(state==='intro'||state==='over') start();
      else run();
    }
  });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

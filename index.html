<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tunnel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a10;touch-action:none;}
  #wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;}
  canvas:focus{outline:none;}
  .overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 42%,rgba(255,176,64,.14),rgba(8,6,12,.55) 62%);cursor:pointer;transition:opacity .22s;}
  .hidden{opacity:0;pointer-events:none;visibility:hidden;}
  .btn{width:clamp(78px,18vw,104px);height:clamp(78px,18vw,104px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe27a,#ffb347 42%,#e08922);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(255,179,71,.22),0 16px 40px rgba(255,140,40,.45);animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .tri{width:0;height:0;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:28px solid #3a2208;margin-left:6px;}
  .redo{font-size:clamp(42px,10vw,56px);color:#3a2208;line-height:1;}
  .big{font-size:clamp(76px,23vw,150px);font-weight:900;color:#fff;line-height:1;
    text-shadow:0 0 32px rgba(255,180,70,.55),4px 4px 0 #3a1808;}
  .best{display:flex;align-items:center;gap:10px;font-size:clamp(24px,6vw,34px);font-weight:800;color:#ffd56a;
    text-shadow:2px 2px 0 #3a1808,0 0 18px rgba(255,200,80,.45);}
  #mute{position:absolute;top:10px;right:12px;z-index:8;width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(20,16,24,.72);color:#ffe27a;font-size:22px;cursor:pointer;line-height:1;
    box-shadow:0 0 0 1px rgba(255,200,120,.2);}
  #pads{position:absolute;left:0;right:0;bottom:18px;z-index:7;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;}
  #pads.show{display:flex;}
  #pads button{pointer-events:auto;width:clamp(64px,16vw,88px);height:clamp(64px,16vw,88px);border:0;border-radius:22px;
    background:rgba(20,16,24,.72);color:#ffe27a;font-size:clamp(28px,8vw,40px);cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,200,120,.2);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0"></canvas>
  <button id="mute" type="button" aria-label="mute">🔊</button>
  <div id="pads">
    <button id="padL" type="button">◀</button>
    <button id="padR" type="button">▶</button>
  </div>
  <div id="intro" class="overlay">
    <div class="btn"><div class="tri"></div></div>
  </div>
  <div id="over" class="overlay hidden">
    <div class="big" id="finalScore">0</div>
    <div class="best"><span>🏆</span><span id="bestScore">0</span></div>
    <div class="btn"><div class="redo">↻</div></div>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var wrap=document.getElementById('wrap');
  var intro=document.getElementById('intro'), over=document.getElementById('over');
  var finalScoreEl=document.getElementById('finalScore'), bestScoreEl=document.getElementById('bestScore');
  var muteBtn=document.getElementById('mute'), pads=document.getElementById('pads');
  var W=0,H=0,DPR=1, t=0, last=performance.now();
  var KEY='cf89-m01l03-tunnel-best';
  var state='intro', score=0, bonus=0, combo=0, best=0, overReady=false, muted=false;
  try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  bestScoreEl.textContent=best;

  var lane=1, laneF=1, speed=0, dist=0, spawnZ=12, shake=0, flash=0;
  var bits=[], dust=[], trail=[];

  var ac=null;
  function tone(f,d,ty,v){
    if(muted) return;
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=ty||'square'; o.frequency.value=f; g.gain.value=v||0.04;
      o.connect(g); g.connect(ac.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
      o.stop(ac.currentTime+d+0.02);
    }catch(e){}
  }
  function chord(arr,d){ for(var i=0;i<arr.length;i++) tone(arr[i], d, i?'triangle':'square', 0.03); }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1, cv.clientWidth||1); H=Math.max(1, cv.clientHeight||1);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function project(x,z,lift){
    var foc=2.35, sc=foc/(z+foc);
    return {x:W/2+x*(W*0.42)*sc, y:H*0.14+(H*0.8)*sc-(lift||0)*sc, s:sc};
  }
  function burst(x,y,col,n,spread){
    spread=spread||3.4;
    for(var i=0;i<n;i++){
      var a=Math.random()*6.28, s=(0.6+Math.random())*spread;
      dust.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.1,life:1,col:col,s:2.2+Math.random()*3.2,g:0.05});
    }
  }
  function quad(a,b,c,d, fill){
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
  }
  function resetRun(){
    lane=1; laneF=1; speed=0.058; dist=0; spawnZ=12; score=0; bonus=0; combo=0;
    bits=[]; dust=[]; trail=[]; shake=0; flash=0; t=0;
    for(var i=0;i<6;i++) spawnWave(14+i*2.5, i<2);
  }
  function start(){
    resetRun();
    state='play';
    intro.classList.add('hidden'); over.classList.add('hidden');
    pads.classList.add('show');
    try{cv.focus({preventScroll:true});}catch(e){}
    chord([392,523,784],0.12);
  }
  function die(){
    if(state!=='play') return;
    state='over'; overReady=false;
    pads.classList.remove('show');
    shake=12; flash=1;
    tone(90,0.28,'sawtooth',0.06);
    if(score>best){ best=score; try{localStorage.setItem(KEY,String(best));}catch(e){} }
    finalScoreEl.textContent=score; bestScoreEl.textContent=best;
    over.classList.remove('hidden');
    setTimeout(function(){ overReady=true; }, 420);
  }
  function goLane(dir){
    if(state==='intro'){ start(); return; }
    if(state==='over'){ if(overReady) start(); return; }
    var n=lane+dir;
    if(n<0||n>2){ shake=4; tone(140,0.05,'square',0.03); return; }
    lane=n;
    tone(520+dir*90,0.05,'triangle',0.035);
  }
  function spawnWave(z, safe){
    var blocked=[];
    if(!safe){
      var r=Math.random();
      if(r<0.55) blocked=[(Math.random()*3)|0];
      else if(r<0.88){
        var skip=(Math.random()*3)|0;
        blocked=[0,1,2].filter(function(i){return i!==skip;});
      }
    }
    for(var i=0;i<3;i++){
      if(blocked.indexOf(i)!==-1) bits.push({kind:'glitch', lane:i, z:z, bob:Math.random()*6});
      else if(Math.random()<0.4) bits.push({kind: Math.random()>0.45?'diamond':'gold', lane:i, z:z, bob:Math.random()*6, taken:false});
    }
  }

  function drawCave(){
    var sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#1a1422'); sky.addColorStop(0.55,'#0c0a10'); sky.addColorStop(1,'#07060a');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1b1520';
    for(var i=0;i<10;i++){
      var x=(i+0.25)*W/10, h=12+((i*17)%26);
      ctx.beginPath(); ctx.moveTo(x-12,0); ctx.lineTo(x,h); ctx.lineTo(x+12,0); ctx.fill();
    }
    var steps=18;
    for(var i=0;i<steps;i++){
      var z0=0.32+i*0.78, z1=z0+0.78;
      var stripe=((Math.floor(z0+dist*0.12)%2)===0);
      for(var L=-1;L<=1;L++){
        var a=project(L-0.48,z0), b=project(L+0.48,z0), c=project(L+0.48,z1), d=project(L-0.48,z1);
        var base=L===0? (stripe? '#6e6a66':'#5c5854') : (stripe? '#4a4642':'#3b3834');
        quad(a,b,c,d, base);
      }
      var wl=project(-1.62,z0), wr=project(1.62,z0), wl2=project(-1.62,z1), wr2=project(1.62,z1);
      quad(project(-2.1,z0), wl, wl2, project(-2.1,z1), stripe?'#2a2624':'#231f1e');
      quad(wr, project(2.1,z0), project(2.1,z1), wr2, stripe?'#2a2624':'#231f1e');
    }
    ctx.strokeStyle='rgba(255,176,64,0.12)'; ctx.lineWidth=2;
    var e0=project(-1.52,0.4), e1=project(-1.52,14), e2=project(1.52,0.4), e3=project(1.52,14);
    ctx.beginPath(); ctx.moveTo(e0.x,e0.y); ctx.lineTo(e1.x,e1.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(e2.x,e2.y); ctx.lineTo(e3.x,e3.y); ctx.stroke();
  }
  function drawGlitch(p,bob){
    var w=Math.max(22,110*p.s), h=Math.max(26,118*p.s);
    var y=p.y-h*0.28+Math.sin(t*0.12+bob)*4*p.s;
    ctx.save(); ctx.translate(p.x,y);
    ctx.fillStyle='#4a1a5c'; ctx.fillRect(-w/2,-h/2,w,h);
    ctx.fillStyle='#c46bff'; ctx.fillRect(-w/2+3,-h/2+3,w*0.38,h*0.28);
    ctx.fillStyle='#2a0a40'; ctx.fillRect(w*0.05,-h*0.05,w*0.36,h*0.4);
    ctx.strokeStyle='#e8b0ff'; ctx.lineWidth=Math.max(1.5,3*p.s);
    ctx.beginPath(); ctx.moveTo(-w*0.3,-h*0.2); ctx.lineTo(0,h*0.05); ctx.lineTo(-w*0.12,h*0.32); ctx.stroke();
    ctx.restore();
  }
  function drawGem(p,kind,bob){
    var r=Math.max(10,26*p.s);
    var y=p.y-40*p.s+Math.sin(t*0.16+bob)*6*p.s;
    ctx.save(); ctx.translate(p.x,y); ctx.rotate(t*0.03);
    ctx.shadowBlur=16*p.s; ctx.shadowColor=kind==='diamond'?'#7efce8':'#ffe566';
    ctx.fillStyle=kind==='diamond'?'#3ed4d8':'#e0b12a';
    ctx.beginPath();
    ctx.moveTo(0,-r*1.2); ctx.lineTo(r*0.9,0); ctx.lineTo(0,r*1.15); ctx.lineTo(-r*0.9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle=kind==='diamond'?'#d9fffb':'#fff1a3';
    ctx.beginPath(); ctx.moveTo(0,-r*1.2); ctx.lineTo(r*0.35,-r*0.1); ctx.lineTo(0,r*0.15); ctx.lineTo(-r*0.2,-r*0.15); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
  }
  function drawTurtle(){
    var p=project(laneF-1, 1.08, 8);
    trail.push({x:p.x,y:p.y,life:1,s:p.s});
    if(trail.length>12) trail.shift();
    for(var i=0;i<trail.length;i++){
      var tr=trail[i];
      ctx.globalAlpha=tr.life*0.2;
      ctx.fillStyle='#7dce55';
      ctx.beginPath(); ctx.arc(tr.x, tr.y-16*tr.s, 9*tr.s, 0, 7); ctx.fill();
      tr.life-=0.08;
    }
    ctx.globalAlpha=1;
    var bob=Math.sin(t*0.22)*3, s=p.s*1.7;
    ctx.save(); ctx.translate(p.x, p.y-18*s+bob);
    ctx.fillStyle='#3d6b28'; ctx.fillRect(-22*s, -8*s, 44*s, 28*s);
    ctx.fillStyle='#62b04a'; ctx.fillRect(-20*s, -18*s, 40*s, 22*s);
    ctx.fillStyle='#1a2218'; ctx.fillRect(-12*s, -12*s, 24*s, 12*s);
    ctx.fillStyle='#7efce8'; ctx.fillRect(-8*s, -9*s, 16*s, 6*s);
    ctx.fillStyle='#c9a227';
    ctx.beginPath(); ctx.moveTo(18*s,-6*s); ctx.lineTo(34*s,-18*s); ctx.lineTo(30*s,-4*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8b6230'; ctx.fillRect(16*s,-8*s, 8*s, 6*s);
    ctx.shadowColor='#ffd27a'; ctx.shadowBlur=18;
    ctx.fillStyle='#ffb347';
    ctx.beginPath(); ctx.arc(-2*s, -28*s, 8*s, 0, 7); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
    if(state==='play' && (t|0)%4===0){
      burst(p.x, p.y+10*s, '#8a847c', 2, 1.6);
    }
  }
  function drawHud(){
    ctx.fillStyle='#fff';
    ctx.font='900 '+Math.max(28,H*0.07)+'px Arial';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=10;
    ctx.fillText(String(score), W/2, 14);
    ctx.shadowBlur=0;
  }

  function frame(now){
    var dt=Math.min(32, now-last)/16.67; last=now; t+=dt;
    ctx.save();
    if(shake>0.2){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.86; }
    drawCave();
    if(state==='play'){
      speed=Math.min(0.128, 0.058+dist*0.00004);
      dist+=speed*dt*14;
      laneF+=(lane-laneF)*Math.min(1,0.34*dt);
      spawnZ-=speed*dt;
      if(spawnZ<12){ spawnWave(17+Math.random(), false); spawnZ+=2.45; }
      for(var i=bits.length-1;i>=0;i--){
        var b=bits[i];
        b.z-=speed*dt;
        if(b.z<0.45){ bits.splice(i,1); continue; }
        if(b.z<1.32 && b.z>0.82 && b.lane===lane){
          if(b.kind==='glitch'){ bits.splice(i,1); die(); continue; }
          if(!b.taken){
            b.taken=true;
            combo+=1;
            bonus+= (b.kind==='diamond'?40:18) * (1+Math.min(5,combo)*0.12);
            var pp=project(b.lane-1,b.z,20);
            burst(pp.x,pp.y, b.kind==='diamond'?'#7efce8':'#ffe566', 12, 4.2);
            tone(b.kind==='diamond'?840:620,0.07,'triangle',0.045);
            bits.splice(i,1);
          }
        }
      }
      score=Math.floor(dist/5)+Math.round(bonus);
    }
    bits.sort(function(a,c){return c.z-a.z;});
    for(var j=0;j<bits.length;j++){
      var ob=bits[j], p=project(ob.lane-1, ob.z, ob.kind==='glitch'?6:22);
      if(ob.kind==='glitch') drawGlitch(p, ob.bob);
      else if(!ob.taken) drawGem(p, ob.kind, ob.bob);
    }
    if(state!=='intro') drawTurtle();
    for(var d=dust.length-1;d>=0;d--){
      var du=dust[d]; du.vy+=du.g||0.05; du.x+=du.vx; du.y+=du.vy; du.life-=0.04*dt;
      ctx.globalAlpha=Math.max(0,du.life); ctx.fillStyle=du.col; ctx.beginPath(); ctx.arc(du.x,du.y,du.s||3,0,7); ctx.fill();
      if(du.life<=0) dust.splice(d,1);
    }
    ctx.globalAlpha=1; ctx.restore();
    var vig=ctx.createRadialGradient(W/2,H*0.5,H*0.16,W/2,H*0.5,H*0.92);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(4,2,8,.55)');
    ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
    if(flash>0.04){ ctx.fillStyle='rgba(180,80,255,'+(flash*0.22)+')'; ctx.fillRect(0,0,W,H); flash*=0.84; }
    if(state==='play'||state==='over') drawHud();
    requestAnimationFrame(frame);
  }

  var px=0, down=false, skipLane=false;
  function onDown(e){
    e.preventDefault();
    if(ac && ac.state==='suspended') ac.resume();
    down=true; px=e.clientX; skipLane=false;
    if(state==='intro'){ start(); skipLane=true; }
    else if(state==='over' && overReady){ start(); skipLane=true; }
  }
  function onUp(e){
    if(!down) return; down=false;
    if(skipLane || state!=='play') return;
    var x=e.clientX||px, dx=x-px;
    if(Math.abs(dx)>28) goLane(dx>0?1:-1);
    else if(x<W*0.38) goLane(-1);
    else if(x>W*0.62) goLane(1);
  }
  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointerup', onUp);
  wrap.addEventListener('pointercancel', function(){ down=false; });
  document.getElementById('padL').addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); goLane(-1); });
  document.getElementById('padR').addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); goLane(1); });
  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    muted=!muted; muteBtn.textContent=muted?'🔇':'🔊';
    if(!muted && ac && ac.state==='suspended') ac.resume();
  });
  window.addEventListener('keydown', function(e){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ e.preventDefault(); goLane(-1); }
    if(e.code==='ArrowRight'||e.code==='KeyD'){ e.preventDefault(); goLane(1); }
    if(e.code==='Space'||e.code==='Enter'){
      e.preventDefault();
      if(state==='intro') start();
      else if(state==='over' && overReady) start();
    }
  });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

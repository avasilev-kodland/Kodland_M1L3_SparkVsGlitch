<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Circuit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a10;}
  body{
    font-family:Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 30%,#24180e 0%,#0c0a10 62%);
  }
  #app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 10px 14px;}
  #hud{width:min(84vmin,480px);height:52px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;position:relative;z-index:2;}
  #score{font:900 32px/1 Arial,sans-serif;color:#fff;text-shadow:0 0 16px rgba(255,170,70,.5),3px 3px 0 #2a1208;}
  .icon{width:44px;height:44px;border:0;border-radius:12px;cursor:pointer;
    background:rgba(20,16,24,.72);color:#ffe27a;font-size:22px;line-height:1;
    box-shadow:0 0 0 1px rgba(255,200,120,.2);}
  .icon:active{transform:scale(.94);}
  #tools{display:flex;gap:8px;}
  #board{width:min(80vmin,440px);display:grid;gap:7px;flex:0 0 auto;}
  .cell{position:relative;aspect-ratio:1;border-radius:14px;background:#1a1714;box-shadow:inset 0 0 0 1px rgba(255,200,120,.08);
    overflow:hidden;}
  .cell.pipe{cursor:pointer;background:linear-gradient(180deg,#2a241c,#1c1814);}
  .cell.pipe:active{transform:scale(.97);}
  .cell.wall{background:#141210;box-shadow:inset 0 0 0 1px #2a2622;}
  .arm{position:absolute;background:#4a433a;border-radius:9px;pointer-events:none;}
  .arm.n{left:50%;top:0;width:28%;height:58%;transform:translateX(-50%);}
  .arm.s{left:50%;bottom:0;width:28%;height:58%;transform:translateX(-50%);}
  .arm.e{right:0;top:50%;height:28%;width:58%;transform:translateY(-50%);}
  .arm.w{left:0;top:50%;height:28%;width:58%;transform:translateY(-50%);}
  .hub{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);
    border-radius:50%;background:#4a433a;pointer-events:none;}
  .cell.live .arm,.cell.live .hub{
    background:linear-gradient(180deg,#ffe27a,#e08922);
    box-shadow:0 0 10px rgba(255,176,64,.75);
  }
  .spark{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c8,#ffb347 55%,#e07018);
    box-shadow:0 0 16px 4px rgba(255,160,50,.55);animation:pulse 1.2s ease-in-out infinite;pointer-events:none;z-index:2;}
  .gem{position:absolute;left:50%;top:50%;width:38%;height:38%;transform:translate(-50%,-50%) rotate(45deg);
    background:linear-gradient(135deg,#d9fffb,#3ed4d8 55%,#1a8a96);pointer-events:none;z-index:2;
    box-shadow:0 0 0 0 rgba(62,212,216,0);border-radius:4px;}
  .cell.live .gem{box-shadow:0 0 18px 4px rgba(126,252,232,.7);background:linear-gradient(135deg,#fff,#7efce8 50%,#3ed4d8);}
  #board.win .cell.live .arm,#board.win .cell.live .hub{background:linear-gradient(180deg,#fff4c8,#c9f24d);}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
  .overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,rgba(255,176,64,.16),rgba(8,6,12,.72) 62%);}
  .overlay.hide{display:none;}
  .play{width:clamp(78px,18vw,104px);height:clamp(78px,18vw,104px);border-radius:50%;border:0;padding:0;
    background:radial-gradient(circle at 35% 30%,#ffe27a,#ffb347 42%,#e08922);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 0 6px rgba(255,179,71,.22),0 16px 40px rgba(255,140,40,.45);animation:pop 1.3s ease-in-out infinite;}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .tri{width:0;height:0;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:28px solid #3a2208;margin-left:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="score">0</div>
    <div id="tools">
      <button type="button" class="icon" id="undo" aria-label="undo">⌫</button>
      <button type="button" class="icon" id="reset" aria-label="reset">↻</button>
      <button type="button" class="icon" id="mute" aria-label="mute">🔊</button>
    </div>
  </div>
  <div id="board"></div>
</div>
<div class="overlay" id="intro">
  <button type="button" class="play" id="playBtn"><div class="tri"></div></button>
</div>
<script>
(function(){
  var N=1,E=2,S=4,W=8;
  var BASE={I:N|S, L:N|E, T:W|N|E, '+':N|E|S|W, S:E, G:W};
  var DIRS=[{b:N,dx:0,dy:-1,o:S,c:'n'},{b:E,dx:1,dy:0,o:W,c:'e'},{b:S,dx:0,dy:1,o:N,c:'s'},{b:W,dx:-1,dy:0,o:E,c:'w'}];
  var LEVELS=[
    {m:['SIG'], r:['010'], t:['010']},
    {m:['SL','.G'], r:['02','01'], t:['03','00']},
    {m:['SIL','..G'], r:['012','001'], t:['013','000']},
    {m:['SL.','.LG'], r:['02.','000'], t:['03.','300']},
    {m:['SIL','..I','..G'], r:['012','000','001'], t:['013','001','000']},
    {m:['S#G','LIL'], r:['1#3','013'], t:['0#0','313']},
    {m:['SIIL','...I','...G'], r:['0112','0000','0001'], t:['0113','0001','0000']},
    {m:['.S.','LTG'], r:['.1.','100'], t:['.0.','330']}
  ];

  var board=document.getElementById('board');
  var intro=document.getElementById('intro');
  var scoreEl=document.getElementById('score');
  var muteBtn=document.getElementById('mute');
  var KEY='cf89-m01l03-circuit-best';
  var state='intro', muted=false, score=0, best=0, lvl=0, busy=false;
  var grid=[], cols=0, rows=0, hist=[];
  var ac=null;
  try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}

  function rotMask(m,r){
    r=((r%4)+4)%4;
    while(r--){
      var n=0;
      if(m&N) n|=E;
      if(m&E) n|=S;
      if(m&S) n|=W;
      if(m&W) n|=N;
      m=n;
    }
    return m;
  }
  function tone(f,d,ty,v){
    if(muted) return;
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=ty||'sine'; o.frequency.value=f; g.gain.value=v||0.045;
      o.connect(g); g.connect(ac.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
      o.stop(ac.currentTime+d+0.02);
    }catch(e){}
  }
  function parse(lv, applyTwist){
    rows=lv.m.length; cols=lv.m[0].length;
    var g=[];
    for(var y=0;y<rows;y++){
      g[y]=[];
      for(var x=0;x<cols;x++){
        var k=lv.m[y][x];
        var r=parseInt(lv.r[y][x],10); if(isNaN(r)) r=0;
        if(applyTwist){
          var tw=parseInt(lv.t[y][x],10); if(!isNaN(tw)) r+=tw;
        }
        g[y][x]={k:k, r:((r%4)+4)%4};
      }
    }
    return g;
  }
  function maskOf(cell){
    var b=BASE[cell.k];
    if(b==null) return 0;
    return rotMask(b, cell.r);
  }
  function inb(x,y){ return y>=0 && x>=0 && y<rows && x<cols; }
  function isPipe(k){ return k==='I'||k==='L'||k==='T'||k==='+'||k==='S'||k==='G'; }
  function flood(){
    var lit={}, q=[], i, x, y;
    for(y=0;y<rows;y++) for(x=0;x<cols;x++) if(grid[y][x].k==='S'){ q.push([x,y]); lit[x+','+y]=1; }
    while(q.length){
      var p=q.pop(); x=p[0]; y=p[1];
      var m=maskOf(grid[y][x]);
      for(i=0;i<4;i++){
        var d=DIRS[i];
        if(!(m&d.b)) continue;
        var nx=x+d.dx, ny=y+d.dy;
        if(!inb(nx,ny)) continue;
        var nb=grid[ny][nx];
        if(!isPipe(nb.k)) continue;
        if(!(maskOf(nb)&d.o)) continue;
        var id=nx+','+ny;
        if(lit[id]) continue;
        lit[id]=1; q.push([nx,ny]);
      }
    }
    return lit;
  }
  function goalLit(lit){
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++) if(grid[y][x].k==='G' && lit[x+','+y]) return true;
    return false;
  }
  function draw(){
    var lit=flood();
    var cells=board.children;
    var i=0;
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++,i++){
      if(lit[x+','+y]) cells[i].classList.add('live');
      else cells[i].classList.remove('live');
    }
    return lit;
  }
  function buildCell(cell,x,y){
    var el=document.createElement('div');
    var k=cell.k;
    el.className='cell'+(k==='#'?' wall': isPipe(k)?' pipe':'');
    el.dataset.x=x; el.dataset.y=y;
    if(isPipe(k)){
      var m=maskOf(cell);
      for(var i=0;i<4;i++){
        if(m&DIRS[i].b){
          var arm=document.createElement('div');
          arm.className='arm '+DIRS[i].c;
          el.appendChild(arm);
        }
      }
      var hub=document.createElement('div'); hub.className='hub'; el.appendChild(hub);
      if(k==='S'){ var s=document.createElement('div'); s.className='spark'; el.appendChild(s); }
      if(k==='G'){ var g=document.createElement('div'); g.className='gem'; el.appendChild(g); }
    }
    return el;
  }
  function render(){
    board.innerHTML='';
    board.style.gridTemplateColumns='repeat('+cols+',1fr)';
    board.style.aspectRatio=cols+' / '+rows;
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++) board.appendChild(buildCell(grid[y][x],x,y));
    draw();
  }
  function snapshot(){
    return grid.map(function(row){ return row.map(function(c){ return c.r; }); });
  }
  function loadLevel(){
    var lv=LEVELS[lvl%LEVELS.length];
    grid=parse(lv, true);
    hist=[];
    board.classList.remove('win');
    busy=false;
    render();
  }
  function win(){
    if(busy) return;
    busy=true;
    board.classList.add('win');
    score+=1; scoreEl.textContent=score;
    if(score>best){ best=score; try{localStorage.setItem(KEY,String(best));}catch(e){} }
    tone(523,0.1,'triangle',0.05);
    setTimeout(function(){ tone(659,0.1,'triangle',0.05); },80);
    setTimeout(function(){ tone(784,0.16,'triangle',0.05); },160);
    setTimeout(function(){
      lvl+=1;
      loadLevel();
    }, 700);
  }
  function rotate(x,y){
    if(state!=='play'||busy) return;
    var cell=grid[y][x];
    if(cell.k==='S'||cell.k==='G'||cell.k==='#'||cell.k==='.'||cell.k==='+') return;
    hist.push(snapshot());
    if(hist.length>40) hist.shift();
    cell.r=(cell.r+1)%4;
    render();
    tone(480,0.05,'triangle',0.03);
    if(goalLit(flood())) win();
  }
  function undo(){
    if(state!=='play'||busy||!hist.length) return;
    var snap=hist.pop();
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++) grid[y][x].r=snap[y][x];
    render();
    tone(240,0.05,'square',0.03);
  }
  function reset(){
    if(state!=='play'||busy) return;
    loadLevel();
    tone(320,0.06,'square',0.03);
  }
  function start(){
    if(ac && ac.state==='suspended') ac.resume();
    score=0; lvl=0; hist=[];
    state='play';
    intro.classList.add('hide');
    scoreEl.textContent='0';
    loadLevel();
    tone(392,0.08,'triangle',0.04);
  }

  board.addEventListener('click', function(e){
    var t=e.target.closest('.cell');
    if(!t||!board.contains(t)) return;
    rotate(+t.dataset.x, +t.dataset.y);
  });
  document.getElementById('playBtn').addEventListener('click', function(e){ e.stopPropagation(); start(); });
  intro.addEventListener('click', function(){ if(state!=='play') start(); });
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('reset').addEventListener('click', reset);
  muteBtn.addEventListener('click', function(){
    muted=!muted; muteBtn.textContent=muted?'🔇':'🔊';
    if(!muted && ac && ac.state==='suspended') ac.resume();
  });
  window.addEventListener('keydown', function(e){
    if(e.code==='Enter'||e.code==='Space'){
      e.preventDefault();
      if(state!=='play') start();
    }
    if(e.code==='KeyZ'||e.code==='Backspace'){ e.preventDefault(); undo(); }
    if(e.code==='KeyR'){ e.preventDefault(); reset(); }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Spark vs Glitch</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0810;touch-action:none;}
  #wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;}
  .overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,176,64,.18),rgba(8,6,12,.58) 58%);cursor:pointer;transition:opacity .22s;}
  .hidden{opacity:0;pointer-events:none;visibility:hidden;}
  .btn{width:clamp(78px,18vw,104px);height:clamp(78px,18vw,104px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe27a,#ffb347 42%,#e08922);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(255,179,71,.22),0 16px 40px rgba(255,140,40,.45);animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .tri{width:0;height:0;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:28px solid #3a2208;margin-left:6px;}
  .redo{font-size:clamp(42px,10vw,56px);color:#3a2208;line-height:1;}
  .big{font-size:clamp(76px,23vw,150px);font-weight:900;color:#fff;line-height:1;
    text-shadow:0 0 32px rgba(255,180,70,.55),4px 4px 0 #3a1808;}
  .best{display:flex;align-items:center;gap:10px;font-size:clamp(24px,6vw,34px);font-weight:800;color:#ffd56a;
    text-shadow:2px 2px 0 #3a1808,0 0 18px rgba(255,200,80,.45);}
  #hud{position:absolute;top:10px;left:10%;right:10%;z-index:4;display:none;pointer-events:none;}
  .bar{height:10px;background:rgba(20,16,24,.72);border-radius:99px;overflow:hidden;border:1px solid rgba(255,200,120,.18);margin-bottom:8px;}
  #tb{height:100%;width:100%;background:linear-gradient(90deg,#ffe27a,#ff8a3a);transform-origin:left center;}
  #pb{height:100%;width:0;background:linear-gradient(90deg,#7dce55,#5dff9a,#9ff7ef);transition:width .12s;}
  #mute{position:absolute;top:10px;right:12px;z-index:6;width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(20,16,24,.72);color:#ffe27a;font-size:22px;cursor:pointer;line-height:1;
    box-shadow:0 0 0 1px rgba(255,200,120,.2);}
  #score{position:absolute;top:42px;left:0;right:0;text-align:center;z-index:4;display:none;
    font:900 clamp(42px,12vw,78px)/1 Arial,sans-serif;color:#fff;
    text-shadow:0 0 22px rgba(255,170,70,.55),3px 3px 0 #2a1208;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="bar"><div id="tb"></div></div>
    <div class="bar"><div id="pb"></div></div>
  </div>
  <div id="score">0</div>
  <button id="mute" type="button" aria-label="mute">🔊</button>
  <div id="intro" class="overlay">
    <div class="btn"><div class="tri"></div></div>
  </div>
  <div id="over" class="overlay hidden">
    <div class="big" id="finalScore">0</div>
    <div class="best"><span>🏆</span><span id="bestScore">0</span></div>
    <div class="btn"><div class="redo">↻</div></div>
  </div>
</div>
<script>
(function(){
  var COLS=8, ROWS=5, ROUND=45;
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var intro=document.getElementById('intro'), over=document.getElementById('over');
  var finalScoreEl=document.getElementById('finalScore'), bestScoreEl=document.getElementById('bestScore');
  var hud=document.getElementById('hud'), tb=document.getElementById('tb'), pb=document.getElementById('pb');
  var scoreEl=document.getElementById('score'), muteBtn=document.getElementById('mute');
  var W=0, H=0, DPR=1, t=0, last=performance.now();
  var state='intro', score=0, best=0, timeLeft=ROUND, muted=false, shake=0, flash=0, winFlash=0;
  var cells=[], parts=[], spark={x:0,y:0,tx:0,ty:0,trail:[]};
  var grid={x:0,y:0,s:0,gap:0};
  var glitchT=0, comboT=0, combo=0;
  var KEY='cf89-m01l03-spark-best-v2';
  try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  bestScoreEl.textContent=best;

  var KINDS={
    grass:{hi:'#9ee36a',mid:'#62b04a',lo:'#2f6a22',dot:'#8b6230',dot2:'#c4894a'},
    diamond:{hi:'#d9fffb',mid:'#3ed4d8',lo:'#157a80',dot:'#e8ffff',dot2:'#1a8a90'},
    gold:{hi:'#fff1a3',mid:'#e0b12a',lo:'#8a640c',dot:'#fff8d0',dot2:'#c9a227'},
    redstone:{hi:'#ff8f7a',mid:'#d42c2c',lo:'#7a1010',dot:'#ffd0c8',dot2:'#8b1515'},
    emerald:{hi:'#b6ffd4',mid:'#21b86a',lo:'#0e5c34',dot:'#d6ffe6',dot2:'#147a45'},
    lapis:{hi:'#9cbcff',mid:'#2a4fd6',lo:'#132a80',dot:'#d6e4ff',dot2:'#1a3299'}
  };
  var KIND_KEYS=Object.keys(KINDS);
  var GRAY={hi:'#b0b0b0',mid:'#7a7a7a',lo:'#3f3f3f',dot:'#5a5a5a',dot2:'#9a9a9a'};
  var GLITCH={hi:'#e8b0ff',mid:'#7a2aa8',lo:'#2a0a40',dot:'#f0c8ff',dot2:'#3a1058'};

  var ac=null;
  function tone(f,d,ty,v){
    if(muted) return;
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=ty||'sine'; o.frequency.value=f; g.gain.value=v||0.045;
      o.connect(g); g.connect(ac.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
      o.stop(ac.currentTime+d+0.03);
    }catch(e){}
  }
  function ping(n){tone(660+n*80,0.09,'sine',0.045);tone(990+n*40,0.12,'triangle',0.025);}
  function smash(){tone(220,0.08,'square',0.04);tone(880,0.14,'sine',0.04);}
  function fanfare(){tone(523,0.12,'triangle',0.05);setTimeout(function(){tone(659,0.12,'triangle',0.05);},80);setTimeout(function(){tone(784,0.2,'triangle',0.05);},160);}

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1, cv.clientWidth||1); H=Math.max(1, cv.clientHeight||1);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    var top=H*0.2, bot=H*0.07, side=W*0.08;
    var gw=W-side*2, gh=H-top-bot, gap=Math.max(3, Math.min(gw,gh)*0.012);
    var s=Math.floor(Math.min((gw-(COLS-1)*gap)/COLS,(gh-(ROWS-1)*gap)/ROWS));
    grid.s=s; grid.gap=gap;
    grid.x=Math.floor((W-(s*COLS+gap*(COLS-1)))/2);
    grid.y=Math.floor(top+(gh-(s*ROWS+gap*(ROWS-1)))/2);
  }
  function idx(c,r){return r*COLS+c;}
  function get(c,r){if(c<0||r<0||c>=COLS||r>=ROWS) return null; return cells[idx(c,r)];}
  function pos(cell){return {x:grid.x+cell.c*(grid.s+grid.gap), y:grid.y+cell.r*(grid.s+grid.gap)};}
  function hash(n){n=(n*16807+13)%2147483647; return (n%1000)/1000;}
  function resetCells(){
    cells=[];
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
      cells.push({c:c,r:r,alive:false,glitch:false,kind:KIND_KEYS[(c+r*3)%KIND_KEYS.length],pop:0,seed:c*17+r*31});
    }
  }
  function aliveCount(){var n=0; for(var i=0;i<cells.length;i++) if(cells[i].alive && !cells[i].glitch) n++; return n;}
  function updateFill(){pb.style.width=(aliveCount()/cells.length*100)+'%';}
  function burst(x,y,color,n,sp){
    for(var i=0;i<n;i++){
      var a=Math.random()*6.28, v=(sp||2)+Math.random()*3;
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,r:2+Math.random()*3,color:color});
    }
  }
  function start(){
    if(ac && ac.state==='suspended') ac.resume();
    score=0; timeLeft=ROUND; shake=0; flash=0; winFlash=0; parts=[]; combo=0; comboT=0; glitchT=3.2;
    resetCells();
    var mid=pos(cells[idx((COLS/2)|0,(ROWS/2)|0)]);
    spark.x=mid.x+grid.s/2; spark.y=mid.y+grid.s/2; spark.tx=spark.x; spark.ty=spark.y; spark.trail=[];
    state='play';
    intro.classList.add('hidden'); over.classList.add('hidden');
    hud.style.display='block'; scoreEl.style.display='block'; scoreEl.textContent='0';
    updateFill(); ping(0);
  }
  function endGame(){
    if(state!=='play') return;
    state='over';
    if(score>best){best=score; try{localStorage.setItem(KEY,String(best));}catch(e){}}
    finalScoreEl.textContent=score; bestScoreEl.textContent=best;
    hud.style.display='none'; winFlash=1; fanfare();
    setTimeout(function(){over.classList.remove('hidden');},650);
  }
  function paint(c,r, splash){
    var cell=get(c,r);
    if(!cell || cell.glitch) return 0;
    if(cell.alive) return 0;
    cell.alive=true; cell.pop=1;
    var p=pos(cell), cx=p.x+grid.s/2, cy=p.y+grid.s/2;
    var pal=KINDS[cell.kind];
    burst(cx,cy,pal.hi, splash?10:22, splash?2:3.2);
    spark.tx=cx; spark.ty=cy;
    return 1;
  }
  function smashGlitch(cell){
    cell.glitch=false; cell.alive=true; cell.pop=1;
    var p=pos(cell), cx=p.x+grid.s/2, cy=p.y+grid.s/2;
    burst(cx,cy,'#ffe27a',28,4);
    spark.tx=cx; spark.ty=cy;
    smash(); shake=8; flash=0.4;
  }
  function hit(c,r){
    var cell=get(c,r); if(!cell) return;
    if(cell.glitch){smashGlitch(cell); score+=2; combo++; comboT=0.7;}
    else if(!cell.alive){
      var gained=paint(c,r,false);
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(var i=0;i<dirs.length;i++) gained+=paint(c+dirs[i][0], r+dirs[i][1], true);
      if(gained){
        combo=comboT>0?combo+1:1; comboT=0.7;
        score+=gained*Math.max(1, Math.min(4,combo));
        ping(Math.min(combo,6));
        flash=0.22;
      }
    } else return;
    scoreEl.textContent=score;
    updateFill();
    if(aliveCount()===cells.length){
      winFlash=0.9; fanfare();
      var live=[]; for(var i=0;i<cells.length;i++) if(cells[i].alive) live.push(cells[i]);
      live.sort(function(){return Math.random()-0.5;});
      for(var k=0;k<Math.min(10,live.length);k++){live[k].alive=false; live[k].glitch=false; live[k].pop=0.4;}
      updateFill();
    }
  }
  function spawnGlitch(){
    var pool=[];
    for(var i=0;i<cells.length;i++) if(cells[i].alive && !cells[i].glitch) pool.push(cells[i]);
    if(!pool.length) return;
    var cell=pool[(Math.random()*pool.length)|0];
    cell.glitch=true; cell.pop=0.6;
    shake=4;
  }
  function spreadGlitch(){
    var seeds=[];
    for(var i=0;i<cells.length;i++) if(cells[i].glitch) seeds.push(cells[i]);
    for(var s=0;s<seeds.length;s++){
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      var d=dirs[(Math.random()*4)|0], n=get(seeds[s].c+d[0], seeds[s].r+d[1]);
      if(n && n.alive && !n.glitch && Math.random()<0.55){n.glitch=true; n.pop=0.4;}
    }
  }
  function cellFromPoint(x,y){
    var pad=4;
    for(var i=0;i<cells.length;i++){
      var p=pos(cells[i]);
      if(x>=p.x-pad && x<=p.x+grid.s+pad && y>=p.y-pad && y<=p.y+grid.s+pad) return cells[i];
    }
    return null;
  }
  function pointer(x,y){
    if(state!=='play'){start(); return;}
    var cell=cellFromPoint(x,y);
    if(cell) hit(cell.c, cell.r);
  }

  function drawCave(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#16111c'); g.addColorStop(1,'#07060a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,150,50,0.05)';
    ctx.beginPath(); ctx.arc(W*0.5,H*0.16,Math.min(W,H)*0.42,0,7); ctx.fill();
    ctx.fillStyle='#1b1522';
    for(var i=0;i<11;i++){
      var x=(i+0.3)*W/11, h=16+((i*19)%32);
      ctx.beginPath(); ctx.moveTo(x-14,0); ctx.lineTo(x,h); ctx.lineTo(x+14,0); ctx.fill();
    }
    function torch(x,y){
      ctx.fillStyle='#5a3a22'; ctx.fillRect(x-4,y,8,22);
      var tg=ctx.createRadialGradient(x,y-6,2,x,y-6,28);
      tg.addColorStop(0,'rgba(255,210,90,.9)'); tg.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(x,y-6,28,0,7); ctx.fill();
    }
    if(grid.s){torch(grid.x-28, grid.y+grid.s*1.2); torch(grid.x+COLS*(grid.s+grid.gap)+16, grid.y+grid.s*2.2);}
  }
  function drawTile(cell){
    var p=pos(cell), s=grid.s, pop=cell.pop*s*0.08;
    var pal=cell.glitch?GLITCH:(cell.alive?KINDS[cell.kind]:GRAY);
    var x=p.x, y=p.y-pop;
    ctx.fillStyle=pal.lo; ctx.fillRect(x,y,s,s);
    ctx.fillStyle=pal.mid; ctx.fillRect(x+1,y+1,s-2,s-2);
    ctx.fillStyle=pal.hi; ctx.fillRect(x+1,y+1,s-2,Math.max(3,s*0.16));
    ctx.fillRect(x+1,y+1,Math.max(3,s*0.12),s-2);
    var px=Math.max(3, s/8);
    if(!cell.alive && !cell.glitch){
      ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(x+s*0.2, y+s*0.45, s*0.18, px);
      ctx.fillRect(x+s*0.55, y+s*0.62, s*0.22, px);
    } else if(cell.kind==='grass' && cell.alive && !cell.glitch){
      ctx.fillStyle='#62b04a'; ctx.fillRect(x+1,y+1,s-2,s*0.34);
      ctx.fillStyle='#8b6230'; ctx.fillRect(x+1,y+s*0.34,s-2,s*0.66-1);
      ctx.fillStyle='#3d7a28';
      ctx.fillRect(x+s*0.15,y+s*0.08,px,px); ctx.fillRect(x+s*0.6,y+s*0.16,px,px);
    } else {
      for(var i=0;i<7;i++){
        var hx=hash(cell.seed*13+i), hy=hash(cell.seed*29+i+3);
        ctx.fillStyle=i%2?pal.dot:pal.dot2;
        ctx.fillRect(x+2+hx*(s-px-4), y+s*0.22+hy*(s*0.62), px, px);
      }
    }
    if(cell.glitch){
      ctx.strokeStyle='#f3c8ff'; ctx.lineWidth=Math.max(2,s*0.06);
      ctx.beginPath();
      ctx.moveTo(x+s*0.18,y+s*0.2); ctx.lineTo(x+s*0.45,y+s*0.48); ctx.lineTo(x+s*0.3,y+s*0.78);
      ctx.moveTo(x+s*0.62,y+s*0.28); ctx.lineTo(x+s*0.8,y+s*0.7);
      ctx.stroke();
      ctx.globalAlpha=0.35+Math.sin(t*0.4)*0.2;
      ctx.fillStyle='#c46bff'; ctx.fillRect(x+1,y+1,s-2,s-2);
      ctx.globalAlpha=1;
    }
    if(cell.pop>0.15){
      ctx.strokeStyle='rgba(255,240,180,.7)'; ctx.lineWidth=2;
      ctx.strokeRect(x+2,y+2,s-4,s-4);
    }
  }
  function drawSpark(){
    spark.x+=(spark.tx-spark.x)*0.18;
    spark.y+=(spark.ty-spark.y)*0.18;
    spark.trail.push({x:spark.x,y:spark.y});
    if(spark.trail.length>14) spark.trail.shift();
    for(var i=0;i<spark.trail.length;i++){
      ctx.globalAlpha=i/spark.trail.length*0.4;
      ctx.fillStyle='#ffb347';
      ctx.beginPath(); ctx.arc(spark.trail[i].x, spark.trail[i].y, 3+i*0.25, 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.shadowColor='#ffd27a'; ctx.shadowBlur=18;
    var g=ctx.createRadialGradient(spark.x-3,spark.y-4,2,spark.x,spark.y,16);
    g.addColorStop(0,'#fff6d6'); g.addColorStop(0.5,'#ffb347'); g.addColorStop(1,'rgba(255,140,40,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(spark.x,spark.y,16,0,7); ctx.fill();
    ctx.shadowBlur=0;
  }

  function frame(now){
    var dt=Math.min(2,(now-last)/16.67); last=now; t+=dt;
    if(state==='play'){
      timeLeft-=dt/60;
      tb.style.transform='scaleX('+Math.max(0,timeLeft/ROUND)+')';
      if(timeLeft<=0) endGame();
      comboT-=dt/60; if(comboT<=0) combo=0;
      glitchT-=dt/60;
      if(glitchT<=0){spawnGlitch(); spreadGlitch(); glitchT=2.4;}
    }
    if(shake>0){shake*=0.86; if(shake<0.2) shake=0;}
    if(flash>0){flash-=0.05*dt; if(flash<0) flash=0;}
    if(winFlash>0){winFlash-=0.03*dt; if(winFlash<0) winFlash=0;}
    for(var i=0;i<cells.length;i++){if(cells[i].pop>0){cells[i].pop-=0.08*dt; if(cells[i].pop<0) cells[i].pop=0;}}
    for(var p=parts.length-1;p>=0;p--){
      var pt=parts[p]; pt.vy+=0.07*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=0.028*dt;
      if(pt.life<=0) parts.splice(p,1);
    }

    ctx.save();
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    drawCave();
    if(cells.length && grid.s){
      for(var i=0;i<cells.length;i++) drawTile(cells[i]);
      if(state==='play' || state==='over') drawSpark();
    }
    ctx.globalCompositeOperation='lighter';
    for(var q=0;q<parts.length;q++){
      var pt=parts[q];
      ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.restore();
    if(flash>0){ctx.fillStyle='rgba(255,230,160,'+(flash*0.18)+')'; ctx.fillRect(0,0,W,H);}
    if(winFlash>0){ctx.fillStyle='rgba(255,210,90,'+(winFlash*0.22)+')'; ctx.fillRect(0,0,W,H);}
    requestAnimationFrame(frame);
  }

  function xy(e){
    var r=cv.getBoundingClientRect();
    var src=e.touches&&e.touches[0]?e.touches[0]:e;
    return {x:src.clientX-r.left, y:src.clientY-r.top};
  }
  cv.addEventListener('mousedown',function(e){e.preventDefault(); var p=xy(e); pointer(p.x,p.y);});
  cv.addEventListener('touchstart',function(e){e.preventDefault(); var p=xy(e); pointer(p.x,p.y);},{passive:false});
  intro.addEventListener('mousedown',function(){if(state!=='play') start();});
  intro.addEventListener('touchstart',function(e){e.preventDefault(); if(state!=='play') start();},{passive:false});
  over.addEventListener('mousedown',function(){if(state!=='play') start();});
  over.addEventListener('touchstart',function(e){e.preventDefault(); if(state!=='play') start();},{passive:false});
  muteBtn.addEventListener('click',function(e){
    e.stopPropagation();
    muted=!muted;
    muteBtn.textContent=muted?'🔇':'🔊';
    if(!muted && ac && ac.state==='suspended') ac.resume();
  });
  window.addEventListener('resize',resize);
  resetCells();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
